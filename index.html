<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VectoJS WebOS — a canvas-native desktop environment built on @vectojs/desktop. The reference template for create-webos."
    />
    <title>VectoJS WebOS</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f172a;
        font-family: "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      #root {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* Do NOT set canvas width/height here — Scene.resize owns CSS px size.
         Fixed 100% fights browser-zoom refits and leaves a top-left island. */
      #root > canvas {
        display: block;
        position: absolute;
        left: 0;
        top: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/desktop/main.ts"></script>
  </body>
</html>
